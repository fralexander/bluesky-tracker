name: Bluesky Tracker

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          pip install atproto

      - name: Lancement du script
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: |
          python tracker.py

      - name: Sauvegarde automatique des archives dans le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive_posts.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto des archives de posts" && git push)
